[options]
; Database configuration
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_btp

; Paths
addons_path = /home/ubuntu/odoo-projects/btp/odoo19/addons,/home/ubuntu/odoo-projects/btp/odoo19/odoo/addons

; Server
http_interface = 0.0.0.0
http_port = 8069
session_cookie_name = session_id_btp

; Logging
logfile = /home/ubuntu/odoo-projects/btp/odoo19/logs/odoo.log
log_level = info

; Security
admin_passwd = admin

; Performance
workers = 0
max_cron_threads = 1

data_dir = /home/ubuntu/odoo-projects/btp/data
